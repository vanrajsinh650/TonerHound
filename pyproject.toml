[project]
name = "tonerhound"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vanraj", email = "vanrajsinhsolanki650@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "pypdfium2>=4.30.0",
    "python-dateutil>=2.8.2",
    "rapidfuzz>=3.0",
    "scipy>=1.10.0",
]

[project.scripts]
tonerhound = "tonerhound:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]
