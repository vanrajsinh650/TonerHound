[project]
name = "tonerhound"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vanraj", email = "vanrajsinhsolanki650@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0",
    "pypdfium2>=4.30.0",
    "python-dateutil>=2.8.2",
    "rapidfuzz>=3.0",
    "scipy>=1.10.0",
]

[project.scripts]
tonerhound = "tonerhound:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "apted>=1.0.3",
    "autoevals>=0.3.0",
    "beautifulsoup4>=4.15.0",
    "fire>=0.7.1",
    "fuzzysearch>=0.8.1",
    "lxml>=6.1.3",
    "pandas>=3.0.5",
    "pytest>=8.0",
    "python-levenshtein>=0.27.4",
    "rich>=15.0.0",
    "ruff>=0.4.0",
    "tqdm>=4.70.0",
    "unidecode>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["research", "research/reference", ".venv"]

