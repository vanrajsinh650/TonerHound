app = "tonerhound-api"
primary_region = "sin"  # Singapore — closest to India

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  # Update after Vercel deploy with your actual domain
  ALLOWED_ORIGINS = "https://tonerhound.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0  # scale to zero when idle

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # 256 MB OOMs with Tesseract + PDF in memory
